<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자동 점검 - 11주차 실습</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>자동 점검</h1>
    <h2>1. 검사 규칙 11건 (validate.js)</h2>
    <p id="summary" role="status"></p>
    <div class="wrap">
      <table>
        <thead><tr><th>번호</th><th>아이디</th><th>비밀번호</th><th>확인</th><th>기대</th><th>실제 결과</th><th>일치</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <h2>2. jQuery 불러오기와 저장 기능</h2>
    <p id="jq-result" role="status"></p>
    <h2>3. 이 브라우저의 저장 기능</h2>
    <p id="storage-result" role="status"></p>

    <h2>4. 화면 동작 확인 (직접 확인, 체크하기)</h2>
    <ul>
      <li><label><input type="checkbox" style="width:auto;margin-right:6px"> 아이디를 "ab"로 입력하면 칸 아래에 안내 문구가 나온다</label></li>
      <li><label><input type="checkbox" style="width:auto;margin-right:6px"> 보기 버튼을 누르면 비밀번호가 보이고, 다시 누르면 가려진다</label></li>
      <li><label><input type="checkbox" style="width:auto;margin-right:6px"> 비밀번호 확인이 다르면 확인 칸 아래에 문구가 나온다</label></li>
      <li><label><input type="checkbox" style="width:auto;margin-right:6px"> 비밀번호 확인 문구가 부드럽게 나타났다가 사라진다 (fadeIn, fadeOut)</label></li>
      <li><label><input type="checkbox" style="width:auto;margin-right:6px"> 모든 값이 맞으면 가입하기 후 저장 문구가 나오고, 비밀번호는 저장되지 않는다</label></li>
    </ul>
    <p><a href="signup.html">회원가입 화면으로 돌아가기</a></p>
  </main>
  <script src="jquery.min.js"></script>
  <script src="validate.js"></script>
  <script>
    var CASES = [
      ['abc', '', '', false],
      ['user01', 'pass1234', 'pass1234', true],
      ['User01', 'pass1234', 'pass1234', false],
      ['user_01', 'pass1234', 'pass1234', false],
      ['user01', 'pass1', 'pass1', false],
      ['user01', '12345678', '12345678', false],
      ['user01', 'abcdefgh', 'abcdefgh', false],
      ['user01', 'pass1234', 'pass1235', false],
      ['2026', 'pass2026', 'pass2026', true],
      ['abcdefghijklm', 'pass1234', 'pass1234', false],
      ['abcdefghijkl', 'abcdefg1', 'abcdefg1', true]
    ];

    function runRules() {
      var tbody = document.getElementById('rows');
      tbody.innerHTML = '';
      var pass = 0;
      var wrong = [];
      CASES.forEach(function (c, i) {
        var msg = getSignupMessage(c[0], c[1], c[2]);
        var actualPass = (msg === '');
        var same = (actualPass === c[3]);
        if (same) { pass++; } else { wrong.push(i + 1); }
        var tr = document.createElement('tr');
        var cells = [String(i + 1), c[0], c[1] || '(비움)', c[2] || '(비움)', c[3] ? '통과' : '실패', actualPass ? '통과' : msg, same ? '✔ 일치' : '✘ 불일치'];
        cells.forEach(function (text, k) {
          var td = document.createElement('td');
          td.textContent = text;
          if (k === 6) { td.className = same ? 'ok' : 'ng'; }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      var summary = '11건 중 ' + pass + '건 일치';
      summary += wrong.length ? ' (불일치 번호: ' + wrong.join(', ') + ')' : '. 모든 케이스가 기대 결과와 같습니다.';
      document.getElementById('summary').textContent = summary;
    }

    function runStorage() {
      var out = document.getElementById('storage-result');
      try {
        localStorage.setItem('storageCheck', 'ok');
        var v = localStorage.getItem('storageCheck');
        localStorage.removeItem('storageCheck');
        out.textContent = v === 'ok' ? '✔ 저장 가능: 이 브라우저에서 아이디 저장 기능을 쓸 수 있습니다.' : '✘ 저장 불가: 값을 다시 읽을 수 없습니다.';
      } catch (e) {
        out.textContent = '✘ 저장 불가: 시크릿 모드이거나 저장이 차단된 브라우저입니다. 다른 브라우저에서 열어 보세요.';
      }
    }

    function runJquery() {
      var out = document.getElementById('jq-result');
      if (typeof window.jQuery === 'function' && window.jQuery.fn.jquery) {
        out.textContent = '✔ jQuery ' + window.jQuery.fn.jquery + ' 가 불러와졌습니다.';
      } else {
        out.textContent = '✘ jQuery가 없습니다. signup.html의 jquery.min.js 줄을 확인하세요.';
      }
    }

    runRules();
    runJquery();
    runStorage();
  </script>
</body>
</html>
