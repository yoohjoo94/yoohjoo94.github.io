<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 11주차 실습</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>회원가입</h1>
    <form id="signup-form" onsubmit="return saveDraft(event)">
      <label for="userid">아이디</label>
      <input type="text" id="userid" name="userid" autocomplete="off">
      <p class="msg" id="userid-msg" aria-live="polite"></p>

      <label for="pw">비밀번호</label>
      <div class="row">
        <input type="password" id="pw" name="pw">
        <button type="button" id="toggle-pw" class="small">보기</button>
      </div>

      <label for="pw2">비밀번호 확인</label>
      <input type="password" id="pw2" name="pw2">
      <p class="msg" id="pw2-msg" aria-live="polite"></p>

      <button type="submit" id="submit-btn">가입하기</button>
      <p class="msg" id="save-msg" role="status"></p>
    </form>
    <p><a href="test.html">자동 점검 페이지 열기</a></p>
  </main>
  <script src="jquery.min.js"></script>
  <script src="validate.js"></script>
  <script src="jq.js"></script>
</body>
</html>
